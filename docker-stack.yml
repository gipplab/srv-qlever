version: '3.8'

services:
  qlever-control:
    # Use the latest image from GitHub Container Registry
    image: ghcr.io/gipplab/qlever-control:latest
    
    volumes:
      # Mount Docker socket to allow running Docker commands on host
      # SECURITY WARNING: Mounting the Docker socket gives this container full control over
      # the Docker daemon, equivalent to root access on the host. Only use in trusted environments.
      # Note: In swarm mode, this will use the socket from the node where the container runs.
      # This also limits horizontal scaling - the service must run with replicas: 1
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount workspace directory for working with files
      - /public/dumps/public:/public/dumps/public
      - /srv:/srv
    
    environment:
      # Set to "true" to test Docker connectivity on startup
      - TEST_DOCKER=false
    
    # Keep container running with stdin and tty
    stdin_open: true
    tty: true
    
    # Deployment configuration for Docker Swarm
    deploy:
      mode: global
      # Restart policy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  qlever:
    image: adfreiburg/qlever:REBUILD-INDEX-BETA
    ports:
      - "7001:7001"
    volumes:
      - /srv/qlever:/index
      - /etc/localtime:/etc/localtime:ro
    # Run as the same UID:GID as the host user (equivalent to -u $(id -u):$(id -g))
    # Set QLEVER_UID and QLEVER_GID in the environment before deploying:
    #   export QLEVER_UID=$(id -u) QLEVER_GID=$(id -g)
    user: "${QLEVER_UID}:${QLEVER_GID}"
    working_dir: /index
    # Use bash -c as entrypoint to execute the server command in a shell,
    # matching: docker run --entrypoint bash ... -c 'qlever-server ...'
    entrypoint: ["bash", "-c"]
    command:
      - "qlever-server -i wikidata -j 8 -p 7001 -m 20G -c 15G -e 5G -k 200 -s 600s -a wikidata_4nOICSfIFEoE > wikidata.server-log.txt 2>&1"
    # Use tini-based init process (equivalent to --init in docker run)
    init: true
    deploy:
      # condition: any restarts on any exit; closest swarm equivalent to --restart=unless-stopped
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - node.role == worker
      labels:
        - "com.qlever.service=qlever-sparql-endpoint"

  qlever-ui:
    image: adfreiburg/qlever-ui:latest
    ports:
      - "7000:7000"
    volumes:
      - /srv/qlever:/app/db
    environment:
      QLEVERUI_DATABASE_URL: "sqlite:////app/db/wikidata.ui-db.sqlite3"
      VIRTUAL_ENV: "/env"
    command:
      - gunicorn
      - --bind
      - :7000
      - --workers
      - "3"
      - --limit-request-line
      - "10000"
      - qlever.wsgi:application
    deploy:
      placement:
         constraints:
           - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      labels:
        - "com.qlever.service=qlever-ui"
