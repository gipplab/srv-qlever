version: '3.8'

services:
  qlever-control:
    # Use the latest image from GitHub Container Registry
    image: ghcr.io/gipplab/qlever-control:latest
    
    volumes:
      # Mount Docker socket to allow running Docker commands on host
      # SECURITY WARNING: Mounting the Docker socket gives this container full control over
      # the Docker daemon, equivalent to root access on the host. Only use in trusted environments.
      # Note: In swarm mode, this will use the socket from the node where the container runs.
      # This also limits horizontal scaling - the service must run with replicas: 1
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount workspace directory for working with files
      - /public/dumps/public:/public/dumps/public
      - /srv:/srv
    
    environment:
      # Set to "true" to test Docker connectivity on startup
      - TEST_DOCKER=false
    
    # Keep container running with stdin and tty
    stdin_open: true
    tty: true
    
    # Deployment configuration for Docker Swarm
    deploy:
      # Run one replica of the service
      # Note: Must be 1 due to Docker socket mount - cannot scale horizontally
      replicas: 1
      
      # Restart policy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
         constraints:
           - node.role == worker
  qlever:
    image: adfreiburg/qlever:latest
    ports:
      - "7001:7001"
    volumes:
      - qlever_data:/index
      - qlever_cache:/cache
    environment:
      - QLEVER_PORT=7001
      - QLEVER_MEMORY_FOR_QUERIES=30G
      - QLEVER_CACHE_MAX_SIZE=10G
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '4'
          memory: 32G
        reservations:
          cpus: '2'
          memory: 16G
      placement:
         constraints:
           - node.role == worker
      labels:
        - "com.qlever.service=qlever-sparql-endpoint"
    networks:
      - qlever_network

  qlever-ui:
    image: adfreiburg/qlever-ui:latest
    ports:
      - "7000:7000"
    environment:
      - QLEVER_BACKEND_URL=http://qlever:7001
      - UI_PORT=7000
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      labels:
        - "com.qlever.service=qlever-ui"
    networks:
      - qlever_network
    # Note: depends_on only affects start order in Swarm, not readiness.
    # The UI should implement retry logic to handle backend startup delays.
    depends_on:
      - qlever

networks:
  qlever_network:
    driver: overlay
    attachable: true

volumes:
  qlever_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/qlever/index
  qlever_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/qlever/cache
