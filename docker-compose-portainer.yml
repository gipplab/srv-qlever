services:
  portainer:
    # Using 'latest' tag for automatic updates. For production stability,
    # consider pinning to a specific version (e.g., portainer/portainer-ce:2.19.4)
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "9000:9000"
      - "9443:9443"
    networks:
      - portainer_net

volumes:
  portainer_data:
    driver: local

networks:
  portainer_net:
    driver: bridge
