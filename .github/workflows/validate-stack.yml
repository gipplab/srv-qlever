name: Validate Docker Stack

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docker-stack.yml'
      - '.github/workflows/validate-stack.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docker-stack.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Initialize Docker Swarm
      run: docker swarm init
    
    - name: Validate stack file syntax
      run: |
        docker stack config -c docker-stack.yml > /dev/null
        echo "✓ Stack file syntax is valid"
    
    - name: Validate YAML syntax
      run: |
        python3 -c "import yaml; yaml.safe_load(open('docker-stack.yml'))"
        echo "✓ YAML syntax is valid"
    
    - name: Check for common issues
      run: |
        echo "Checking for latest tags..."
        if grep -q ":latest" docker-stack.yml; then
          echo "⚠️  Warning: Using 'latest' tag detected. Consider using specific versions in production."
        fi
        
        echo "Checking for resource limits..."
        if grep -q "resources:" docker-stack.yml; then
          echo "✓ Resource limits are defined"
        else
          echo "⚠️  Warning: No resource limits defined"
        fi
        
        echo "Checking for health checks..."
        if grep -q "healthcheck:" docker-stack.yml; then
          echo "✓ Health checks are defined"
        else
          echo "ℹ️  Info: No health checks defined (optional)"
        fi
    
    - name: Validate environment file example
      run: |
        if [ -f .env.example ]; then
          echo "✓ .env.example file exists"
        else
          echo "⚠️  Warning: .env.example file not found"
        fi
